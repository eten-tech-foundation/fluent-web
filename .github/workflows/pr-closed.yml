# Cleanup Azure Static Web Apps preview and delete branch
name: PR Closed

on:
  pull_request:
    types: [closed]

jobs:
  # Runs on every closed PR, merged or not — the preview should be torn down
  # either way. Left on the default token deliberately: this action uses
  # repo_token for GitHub deployment statuses and PR comments, and narrowing it
  # blind risks breaking preview teardown. Scoping it belongs in its own PR,
  # where a real preview can verify the result.
  close-preview:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Close Azure Static Web Apps Preview
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "close"

  # A separate job so a failed preview teardown cannot skip branch deletion,
  # and so this half can hold a tightly scoped token.
  delete-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete merged branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;

            // A fork's head ref names a branch in the fork, not here. Deleting
            // `heads/<branch>` would target a same-named branch in this repo.
            if (pr.head.repo.full_name !== context.payload.repository.full_name) {
              core.info(`Skipping fork branch: ${pr.head.repo.full_name}:${branch}`);
              return;
            }

            const protectedBranches = ['main', 'master', 'develop'];
            if (protectedBranches.includes(branch)) {
              core.info(`Refusing to delete protected branch: ${branch}`);
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              core.info(`Deleted branch: ${branch}`);
            } catch (error) {
              // Dependabot deletes its own branches after merge, and GitHub's
              // "Delete branch" button races this job. Already gone is success.
              if (error.status === 404 || error.status === 422) {
                core.info(`Branch already deleted: ${branch}`);
                return;
              }
              throw error;
            }
