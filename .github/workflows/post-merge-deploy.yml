# Deploys to the development Static Web App after every merge to main.
#
# Tags are deliberately NOT a trigger here. `cut-release.yml` already
# deploys the tag to QA when it's pushed; a tag trigger on this file would
# deploy QA a second time.
name: Post-merge Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-dev:
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      environment: development
      vite_environment: development
      app_version: ${{ format('dev-{0}', github.sha) }}
      rte_pericope: true
