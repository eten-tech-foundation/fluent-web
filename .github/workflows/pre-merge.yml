# Validates Pull Requests
name: Pre-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

jobs:
  workflow-pins:
    name: Action pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The checker comes from the base branch, never from the PR. Otherwise a
      # pull request could replace the script with one that exits 0 and add an
      # unpinned action in the same commit, and this gate would pass.
      - name: Checkout base revision (trusted checker)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          persist-credentials: false

      - name: Verify every action is pinned to a commit SHA
        working-directory: pr
        run: |
          checker=../base/.github/scripts/check-action-pins.rb
          if [[ ! -f "$checker" ]]; then
            echo "::warning::Base revision has no checker yet; using this PR's copy. Expected only for the PR that introduces the gate."
            checker=.github/scripts/check-action-pins.rb
          fi
          ruby "$checker"

  validate:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint and format check
        run: |
          pnpm lint
          pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build test
        run: pnpm build
